[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "google-workspace-mcp"
version = "1.0.0"
description = "Agent-agnostic MCP server exposing Gmail and Google Docs tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
mcp-google-workspace = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
